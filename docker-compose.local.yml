    PAPER_COPY_MINIMUM_SOURCE_VALUE_USD: ${PAPER_COPY_MINIMUM_SOURCE_VALUE_USD:-1}
    PAPER_COPY_MAXIMUM_SOURCE_EXPOSURE_PCT: ${PAPER_COPY_MAXIMUM_SOURCE_EXPOSURE_PCT:-10}
    PAPER_COPY_MAXIMUM_TOKEN_EXPOSURE_PCT: ${PAPER_COPY_MAXIMUM_TOKEN_EXPOSURE_PCT:-3}
