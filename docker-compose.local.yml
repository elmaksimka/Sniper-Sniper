    PAPER_COPY_BREAK_EVEN_ACTIVATION_PCT: ${PAPER_COPY_BREAK_EVEN_ACTIVATION_PCT:-50}
    PAPER_COPY_TRAILING_ACTIVATION_PCT: ${PAPER_COPY_TRAILING_ACTIVATION_PCT:-100}
    PAPER_COPY_TRAILING_DRAWDOWN_PCT: ${PAPER_COPY_TRAILING_DRAWDOWN_PCT:-25}
    PAPER_COPY_STRATEGY_VERSION: ${PAPER_COPY_STRATEGY_VERSION:-route-risk-v2}
