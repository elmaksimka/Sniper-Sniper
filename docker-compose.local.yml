    PAPER_COPY_EXECUTION_POLL_SECONDS: ${PAPER_COPY_EXECUTION_POLL_SECONDS:-2}
    PAPER_COPY_SUMMARY_INTERVAL_SECONDS: ${PAPER_COPY_SUMMARY_INTERVAL_SECONDS:-1800}
    PAPER_COPY_SUMMARY_ENABLED: ${PAPER_COPY_SUMMARY_ENABLED:-false}
    PAPER_COPY_QUOTE_RETRY_SECONDS: ${PAPER_COPY_QUOTE_RETRY_SECONDS:-30}
    PAPER_COPY_QUOTE_MAX_ATTEMPTS: ${PAPER_COPY_QUOTE_MAX_ATTEMPTS:-3}
    PAPER_COPY_MAX_SIGNAL_AGE_SECONDS: ${PAPER_COPY_MAX_SIGNAL_AGE_SECONDS:-30}
    PAPER_COPY_RECONCILIATION_INTERVAL_SECONDS: ${PAPER_COPY_RECONCILIATION_INTERVAL_SECONDS:-30}
    PAPER_COPY_DAILY_REPORT_ENABLED: ${PAPER_COPY_DAILY_REPORT_ENABLED:-false}
    PAPER_COPY_DAILY_REPORT_HOUR: ${PAPER_COPY_DAILY_REPORT_HOUR:-10}
    PAPER_COPY_DAILY_REPORT_MINUTE: ${PAPER_COPY_DAILY_REPORT_MINUTE:-30}
    PAPER_COPY_DAILY_REPORT_TIMEZONE: ${PAPER_COPY_DAILY_REPORT_TIMEZONE:-Europe/Kyiv}
    PAPER_COPY_DAILY_REPORT_DATE: ${PAPER_COPY_DAILY_REPORT_DATE:-}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
    TELEGRAM_STATUS_INTERVAL_SECONDS: ${TELEGRAM_STATUS_INTERVAL_SECONDS:-1800}
    TELEGRAM_STATUS_WINDOW_MINUTES: ${TELEGRAM_STATUS_WINDOW_MINUTES:-30}
    TELEGRAM_WORKER_SUMMARY_ENABLED: ${TELEGRAM_WORKER_SUMMARY_ENABLED:-true}
    DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-false}
    DISCOVERY_PROGRAM_IDS: ${DISCOVERY_PROGRAM_IDS:-6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P,pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA}
    DISCOVERY_PAGE_SIZE: ${DISCOVERY_PAGE_SIZE:-50}
    DISCOVERY_MAX_PAGES: ${DISCOVERY_MAX_PAGES:-1}
    DISCOVERY_POLL_INTERVAL_SECONDS: ${DISCOVERY_POLL_INTERVAL_SECONDS:-120}
    DISCOVERY_RETRY_MAX_SECONDS: ${DISCOVERY_RETRY_MAX_SECONDS:-900}
    CANDIDATE_ENRICHMENT_ENABLED: ${CANDIDATE_ENRICHMENT_ENABLED:-false}
    CANDIDATE_ENRICHMENT_INTERVAL_SECONDS: ${CANDIDATE_ENRICHMENT_INTERVAL_SECONDS:-30}
    CANDIDATE_ENRICHMENT_MIN_SCORE: ${CANDIDATE_ENRICHMENT_MIN_SCORE:-35}
    CANDIDATE_ENRICHMENT_HISTORY_LIMIT: ${CANDIDATE_ENRICHMENT_HISTORY_LIMIT:-75}
    CANDIDATE_ENRICHMENT_MAXIMUM_HISTORY_TRANSACTIONS: ${CANDIDATE_ENRICHMENT_MAXIMUM_HISTORY_TRANSACTIONS:-1000}
    CANDIDATE_ADAPTIVE_INITIAL_TRANSACTIONS: ${CANDIDATE_ADAPTIVE_INITIAL_TRANSACTIONS:-300}
    CANDIDATE_ADAPTIVE_CONTINUATION_SCORE: ${CANDIDATE_ADAPTIVE_CONTINUATION_SCORE:-75}
    CANDIDATE_ADAPTIVE_MAX_UNMATCHED_SELL_RATIO: ${CANDIDATE_ADAPTIVE_MAX_UNMATCHED_SELL_RATIO:-0.25}
    CANDIDATE_ADAPTIVE_MIN_REALIZED_POSITIONS: ${CANDIDATE_ADAPTIVE_MIN_REALIZED_POSITIONS:-5}
    CANDIDATE_ADAPTIVE_MIN_PRICED_TRADE_RATIO: ${CANDIDATE_ADAPTIVE_MIN_PRICED_TRADE_RATIO:-0.6}
    CANDIDATE_ENRICHMENT_MAX_PER_CYCLE: ${CANDIDATE_ENRICHMENT_MAX_PER_CYCLE:-1}
    CANDIDATE_ENRICHMENT_RETRY_SECONDS: ${CANDIDATE_ENRICHMENT_RETRY_SECONDS:-1800}
    CANDIDATE_SOURCE_WINDOW_HOURS: ${CANDIDATE_SOURCE_WINDOW_HOURS:-24}
    CANDIDATE_SOURCE_TOKEN_LIMIT: ${CANDIDATE_SOURCE_TOKEN_LIMIT:-25}
    CANDIDATE_SOURCE_TRADERS_PER_TOKEN: ${CANDIDATE_SOURCE_TRADERS_PER_TOKEN:-10}
    CANDIDATE_SOURCE_MINIMUM_TOKEN_TRADES: ${CANDIDATE_SOURCE_MINIMUM_TOKEN_TRADES:-10}
    CANDIDATE_SOURCE_MINIMUM_TOKEN_WALLETS: ${CANDIDATE_SOURCE_MINIMUM_TOKEN_WALLETS:-5}
    CANDIDATE_SOURCE_MINIMUM_OBSERVED_MINUTES: ${CANDIDATE_SOURCE_MINIMUM_OBSERVED_MINUTES:-30}
    CANDIDATE_SOURCE_MINIMUM_CURRENT_MULTIPLE: ${CANDIDATE_SOURCE_MINIMUM_CURRENT_MULTIPLE:-3}
    CANDIDATE_SOURCE_EARLY_ENTRY_MINUTES: ${CANDIDATE_SOURCE_EARLY_ENTRY_MINUTES:-30}
    CANDIDATE_SOURCE_EARLY_ENTRY_MAX_MULTIPLE: ${CANDIDATE_SOURCE_EARLY_ENTRY_MAX_MULTIPLE:-2}
    CANDIDATE_EXTERNAL_DISCOVERY_INTERVAL_SECONDS: ${CANDIDATE_EXTERNAL_DISCOVERY_INTERVAL_SECONDS:-21600}
    CANDIDATE_EXTERNAL_TOKEN_LIMIT: ${CANDIDATE_EXTERNAL_TOKEN_LIMIT:-1}
    CANDIDATE_AUDIT_TOKEN_CAP: ${CANDIDATE_AUDIT_TOKEN_CAP:-100}
    CANDIDATE_EXTERNAL_MINIMUM_REALIZED_PNL_USD: ${CANDIDATE_EXTERNAL_MINIMUM_REALIZED_PNL_USD:-0}
    CANDIDATE_EXTERNAL_MINIMUM_REALIZED_ROI: ${CANDIDATE_EXTERNAL_MINIMUM_REALIZED_ROI:-0}
    AUTO_PROMOTE_WALLET_SCORE: ${AUTO_PROMOTE_WALLET_SCORE:-65}
    AUTO_PROMOTE_MAX_MONITORS: ${AUTO_PROMOTE_MAX_MONITORS:-100}
    ADMIN_API_KEY: ""
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  restart: "no"

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
    shm_size: 512mb
    restart: "no"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_engine}
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  migrate:
    <<: *local-app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *local-app
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      flaresolverr:
        condition: service_started
    stop_grace_period: 60s

  api:
    <<: *local-app
    command: ["uvicorn", "app.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

volumes:
  local_postgres_data:
