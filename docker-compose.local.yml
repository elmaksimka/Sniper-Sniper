name: alpha-engine-local

x-local-app: &local-app
  image: alpha-engine:local
  build:
    context: .
    target: runtime
  environment:
    ENVIRONMENT: development
    APP_VERSION: ${APP_VERSION:-0.1.0}
    GIT_SHA: ${GIT_SHA:-local}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-alpha}:${POSTGRES_PASSWORD:-alpha-local-only}@postgres:5432/${POSTGRES_DB:-alpha_engine}
    SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet.solana.com}
    TRANSACTION_HISTORY_MODE: standard
    HELIUS_API_KEY: ""
    HELIUS_RPC_URL: ""
    HELIUS_TIMEOUT_SECONDS: ${HELIUS_TIMEOUT_SECONDS:-15}
    HELIUS_MAX_RETRIES: ${HELIUS_MAX_RETRIES:-4}
    HELIUS_RETRY_BASE_SECONDS: ${HELIUS_RETRY_BASE_SECONDS:-1}
    HELIUS_RETRY_MAX_SECONDS: ${HELIUS_RETRY_MAX_SECONDS:-30}
    HELIUS_MAX_CONCURRENCY: ${HELIUS_MAX_CONCURRENCY:-2}
    MONITOR_POLL_INTERVAL_SECONDS: ${MONITOR_POLL_INTERVAL_SECONDS:-30}
    MONITOR_PAGE_SIZE: ${MONITOR_PAGE_SIZE:-20}
    MONITOR_MAX_PAGES: ${MONITOR_MAX_PAGES:-3}
    WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
    WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-360}
    READINESS_CHECK_TIMEOUT_SECONDS: ${READINESS_CHECK_TIMEOUT_SECONDS:-10}
    ALPHA_WALLET_SCORE_THRESHOLD: ${ALPHA_WALLET_SCORE_THRESHOLD:-65}
    ALPHA_EARLY_TOKEN_SCORE_THRESHOLD: ${ALPHA_EARLY_TOKEN_SCORE_THRESHOLD:-45}
    ALPHA_EARLY_TOKEN_MIN_TRADES: ${ALPHA_EARLY_TOKEN_MIN_TRADES:-3}
    ALPHA_EARLY_TOKEN_MIN_WALLETS: ${ALPHA_EARLY_TOKEN_MIN_WALLETS:-2}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
    TELEGRAM_STATUS_INTERVAL_SECONDS: ${TELEGRAM_STATUS_INTERVAL_SECONDS:-1800}
    TELEGRAM_STATUS_WINDOW_MINUTES: ${TELEGRAM_STATUS_WINDOW_MINUTES:-30}
    DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
    DISCOVERY_PROGRAM_IDS: ${DISCOVERY_PROGRAM_IDS:-6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P,pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA}
    DISCOVERY_PAGE_SIZE: ${DISCOVERY_PAGE_SIZE:-20}
    DISCOVERY_MAX_PAGES: ${DISCOVERY_MAX_PAGES:-1}
    DISCOVERY_POLL_INTERVAL_SECONDS: ${DISCOVERY_POLL_INTERVAL_SECONDS:-120}
    DISCOVERY_RETRY_MAX_SECONDS: ${DISCOVERY_RETRY_MAX_SECONDS:-900}
    AUTO_PROMOTE_WALLET_SCORE: ${AUTO_PROMOTE_WALLET_SCORE:-65}
    AUTO_PROMOTE_MAX_MONITORS: ${AUTO_PROMOTE_MAX_MONITORS:-100}
    ADMIN_API_KEY: ""
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  restart: "no"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_engine}
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  migrate:
    <<: *local-app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *local-app
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s

  api:
    <<: *local-app
    command: ["uvicorn", "app.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

volumes:
  local_postgres_data:
