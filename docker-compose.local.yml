    ALPHA_TRADER_RAPID_ROUND_TRIP_SECONDS: ${ALPHA_TRADER_RAPID_ROUND_TRIP_SECONDS:-120}
    ALPHA_TRADER_MAX_RAPID_ROUND_TRIPS: ${ALPHA_TRADER_MAX_RAPID_ROUND_TRIPS:-0}
    ALPHA_SIGNAL_MAX_AGE_SECONDS: ${ALPHA_SIGNAL_MAX_AGE_SECONDS:-300}
    PAPER_COPY_ENABLED: ${PAPER_COPY_ENABLED:-false}
    PAPER_COPY_SOURCE_WALLET: ${PAPER_COPY_SOURCE_WALLET:-}
