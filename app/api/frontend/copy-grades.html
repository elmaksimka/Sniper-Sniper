<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Copy Grade Radar · Alpha Engine</title>
  <link rel="stylesheet" href="/static/copy-grades.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow"><span class="pulse"></span> ALPHA ENGINE · LIVE AUDIT</p>
        <h1>Copy Grade <span>Radar</span></h1>
        <p class="subtitle">Точні оцінки гаманців, відібраних для аналізу копітрейдингу.</p>
      </div>
      <div class="hero-meta">
        <button id="homeButton" class="home-button" type="button">Home</button>
        <span id="connection" class="status">Оновлення…</span>
        <span id="updatedAt" class="updated">—</span>
      </div>
    </header>

    <section class="audit-strip" aria-label="Прогрес аудиту монет">
      <button type="button" class="audit-counter" data-token-filter="all"><span>Монет у аудиті</span><strong id="tokensTotal">—</strong></button>
      <button type="button" class="audit-counter" data-token-filter="completed"><span>Пройдено</span><strong id="tokensCompleted">—</strong></button>
      <button type="button" class="audit-counter" data-token-filter="in-progress"><span>У роботі / черзі</span><strong id="tokensInProgress">—</strong></button>
      <div><span>Наступне оновлення</span><strong id="nextRefresh">—</strong></div>
    </section>

    <section id="summary" class="summary" aria-label="Зведення категорій"></section>

    <section id="tokenDetails" class="token-details" aria-live="polite" hidden>
      <header class="details-header">
        <div>
          <p class="details-eyebrow">МОНЕТИ ТА ЇХНІ ТОП-ТРЕЙДЕРИ</p>
          <h2 id="tokenDetailsTitle">Деталі аудиту</h2>
        </div>
        <button id="closeTokenDetails" class="details-close" type="button" aria-label="Закрити">×</button>
      </header>
      <div id="tokenList" class="token-list"></div>
    </section>

    <section class="toolbar">
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Пошук за адресою гаманця" autocomplete="off">
      </label>
      <div class="legend">
        <span><i class="dot main"></i> Основна оцінка</span>
        <span><i class="dot copy"></i> Copy-оцінка</span>
      </div>
    </section>

    <div id="error" class="error" hidden></div>
    <section id="groups" class="groups" aria-live="polite">
      <div class="loading"><span></span><span></span><span></span></div>
    </section>

    <footer>
      <span>Оновлення рівно о :00 та :30 за Києвом.</span>
      <span id="walletTotal">0 гаманців</span>
    </footer>
  </main>
  <script src="/static/copy-grades.js" defer></script>
</body>
</html>
