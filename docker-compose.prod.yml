x-alpha-engine: &alpha-engine
  image: alpha-engine:${IMAGE_TAG:-latest}
  build:
    context: .
    target: runtime
    args:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:?GIT_SHA must be set in .env}
  env_file:
    - path: .env
      required: false
  environment:
    ENVIRONMENT: production
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_engine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *alpha-engine
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *alpha-engine
    command: ["python", "-m", "app.worker"]
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-60s}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *alpha-engine
    command:
      - uvicorn
      - app.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s

  backup:
    image: postgres:17
    profiles: ["operations"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:-alpha}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_engine}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -ec
      - |
        umask 077
        stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
        target="/backups/alpha_engine_$${stamp}.dump"
        test ! -e "$${target}"
        pg_dump \
          --host=postgres \
          --username="$${POSTGRES_USER}" \
          --dbname="$${POSTGRES_DB}" \
          --format=custom \
          --compress=9 \
          --file="$${target}"
        pg_restore --list "$${target}" >/dev/null
        echo "Verified backup: $${target}"
    restart: "no"

volumes:
  postgres_data:
