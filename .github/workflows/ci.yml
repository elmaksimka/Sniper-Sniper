name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: alpha
          POSTGRES_DB: alpha_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha -d alpha_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://alpha:alpha@localhost:5432/alpha_engine
      TEST_DATABASE_URL: postgresql+asyncpg://alpha:alpha@localhost:5432/alpha_engine

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Lint
        run: poetry run ruff check app tests

      - name: Type check
        run: poetry run mypy app

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Verify model and migration parity
        run: poetry run alembic check

      - name: Test
        run: poetry run pytest -q

      - name: Validate production Compose
        run: >-
          docker compose
          --env-file .env.production.example
          -f docker-compose.prod.yml
          --profile operations
          config --quiet

      - name: Build production image
        run: docker build --target runtime -t alpha-engine:${{ github.sha }} .
